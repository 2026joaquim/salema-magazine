.map::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,240,200,.22),transparent 45%,rgba(60,40,20,.10));mix-blend-mode:soft-light}
svg.over{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* sea sparkle */
.spark{animation:sp 3s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:0}50%{opacity:.9}}
/* trees swaying hint */
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
/* cloud shadows on the ground */
.shadow{position:absolute;border-radius:50%;background:rgba(40,50,30,.16);filter:blur(28px);animation:drift linear infinite}
.cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(14px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(calc(var(--w) + 30vw))}}
/* birds */
.bird{position:absolute;width:34px;height:16px;offset-rotate:auto}
.bird svg{width:100%;height:100%;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
.flock{position:absolute;inset:0;animation:fly linear infinite}
@keyframes fly{from{transform:translate(-25%,30%)}to{transform:translate(125%,-30%)}}
/* labels */
.pin{position:absolute;transform:translate(-50%,-100%) rotateX(calc(-1 * var(--rx)));transform-origin:bottom center;cursor:pointer;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.pin .tag{background:var(--brown);color:#fff;font-weight:500;font-size:13px;padding:6px 11px;border-radius:99px;white-space:nowrap;box-shadow:0 6px 16px rgba(60,40,25,.3);transition:transform .2s}
.pin .tag.g{background:var(--green)}
.pin .stem{width:2px;height:26px;background:var(--brown)}
.pin .dot{width:10px;height:10px;border-radius:50%;background:var(--brown);box-shadow:0 0 0 0 rgba(109,79,58,.6);animation:pulse 2s infinite}
.pin:hover .tag{transform:scale(1.08)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(109,79,58,.55)}100%{box-shadow:0 0 0 14px rgba(109,79,58,0)}}
.info{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#fff;border-radius:16px;padding:14px 18px;max-width:min(420px,90vw);box-shadow:0 14px 40px rgba(60,40,25,.25);opacity:0;transition:.3s;z-index:30;font-size:14px;line-height:1.45}
.info.on{opacity:1;transform:translateX(-50%)}
.info b{display:block;font-size:16px;margin-bottom:4px}
.ctrl{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:25}
.ctrl button{font-family:inherit;font-size:13px;font-weight:500;border:1.5px solid var(--brown);background:rgba(237,227,209,.9);color:var(--brown);padding:7px 13px;border-radius:99px;cursor:pointer}
.ctrl button.on,.ctrl button:hover{background:var(--brown);color:#fff}
.night .map{filter:brightness(.55) saturate(.55)}
.night .map::after{background:rgba(20,40,85,.45);mix-blend-mode:multiply}
.night body,.night{background:#1d2630}
.light{opacity:0;transition:opacity 1s}
.night .light{opacity:1}
.night .cloud{background:rgba(160,170,190,.25)}
.night .flock{display:none}
.lamp{animation:flick 3s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.75}to{opacity:1}}

<script>
const W=1240,H=766;
const pins=[
 {x:212,y:88,t:"Praia da Salema",d:"A praia e a aldeia da Salema, a poucos minutos. Ponto de partida para o Fisherman's Trail da Rota Vicentina.",g:1},
 {x:735,y:258,t:"Alma Mater",d:"Terapias e massagens, no coração do parque."},
 {x:1100,y:450,t:"Atividades",d:"Surf, bicicletas, tours e workshops de regeneração (SER).",g:1},
 {x:570,y:655,t:"Cowork",d:"Espaço de cowork digital."},
 {x:700,y:690,t:"Eco Store",d:"Produtos biológicos e locais."},
 {x:835,y:690,t:"Entrada",d:"Chegada ao parque.",g:1}
];
const box=document.getElementById('pins'),info=document.getElementById('info');
pins.forEach(p=>{const e=document.createElement('div');e.className='pin';e.style.left=(p.x/W*100)+'%';e.style.top=(p.y/H*100)+'%';
 e.innerHTML=`<span class="tag ${p.g?'g':''}">${p.t}</span><span class="stem"></span><span class="dot"></span>`;
 e.onclick=ev=>{ev.stopPropagation();info.innerHTML=`<b>${p.t}</b>${p.d}`;info.classList.add('on')};box.appendChild(e)});
document.body.onclick=()=>info.classList.remove('on');
const world=document.getElementById('world');
function fit(){const s=Math.min(innerWidth/W*1.05,innerHeight/H*1.25,1.25);world.style.setProperty('--w',W*s+'px');world.style.setProperty('--h',H*s+'px');document.documentElement.style.setProperty('--w',W*s+'px')}
fit();addEventListener('resize',fit);
let rx=38,rz=-8,tx=0,ty=0,auto=true,t0=performance.now();
function set(){world.style.setProperty('--rx',rx+'deg');world.style.setProperty('--rz',rz+'deg');world.style.setProperty('--tz','0px')}
function move(nx,ny){rx=38+ny*14;rz=-8+nx*16;set()}
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){auto=false;document.getElementById('auto').classList.remove('on');move(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1)}});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;auto=false;move(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30)))});
(function loop(now){if(auto){const k=(now-t0)/1000;move(Math.sin(k*.18),Math.sin(k*.11)*.6)}requestAnimationFrame(loop)})(t0);
document.getElementById('auto').onclick=e=>{e.stopPropagation();auto=!auto;e.target.classList.toggle('on',auto)};
const dayB=document.getElementById('day'),nightB=document.getElementById('night');
dayB.onclick=e=>{e.stopPropagation();document.documentElement.classList.remove('night');dayB.classList.add('on');nightB.classList.remove('on')};
nightB.onclick=e=>{e.stopPropagation();document.documentElement.classList.add('night');nightB.classList.add('on');dayB.classList.remove('on')};
set();
</script>
